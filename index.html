<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Meta Tags -->
    <title>SMILEORA DENTAL | Modern Dentistry & Luxury Aesthetics</title>
    <meta name="title" content="SMILEORA DENTAL | Modern Dentistry & Luxury Aesthetics" />
    <meta name="description" content="Precision dentistry meets luxury wellness and state-of-the-art dental technology. Experience bespoke cosmetic smile design, dental implants, Invisalign, and comfort-first care." />
    <meta name="keywords" content="luxury dentist, cosmetic dentistry, dental implants, smile makeover, teeth whitening, clear aligners, comfortable dental clinic" />
    <meta name="theme-color" content="#12343B" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smileoradental.com/" />
    <meta property="og:title" content="SMILEORA DENTAL | Modern Dentistry & Luxury Aesthetics" />
    <meta property="og:description" content="Advanced dental care designed around your comfort, confidence, and long-term smile." />
    <meta property="og:image" content="/images/hero-smile.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="SMILEORA DENTAL | Modern Dentistry & Luxury Aesthetics" />
    <meta property="twitter:description" content="Advanced dental care designed around your comfort, confidence, and long-term smile." />
    <meta property="twitter:image" content="/images/hero-smile.jpg" />

    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data Schema for Local Medical Clinic -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Smileora Dental",
        "image": "/images/clinic-lounge.jpg",
        "telephone": "+1 (800) 555-0199",
        "email": "concierge@smileoradental.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "450 Luxury Boulevard, Suite 800",
          "addressLocality": "Beverly Hills",
          "addressRegion": "CA",
          "postalCode": "90210",
          "addressCountry": "US"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 34.0736,
          "longitude": -118.4004
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday"],
            "opens": "09:00",
            "closes": "15:00"
          }
        ],
        "priceRange": "$$$$"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
